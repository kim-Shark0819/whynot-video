                  key: seed-users
            - name: USER_QUOTAS
              valueFrom:
                secretKeyRef:
                  name: whynot-auth
                  key: user-quotas
            # 이미지 모델 리전은 영상 출력 리전과 독립이다. Stability 이미지 모델은
