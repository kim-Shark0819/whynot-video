              value: "claude-opus-5,claude-fable-5"
            - name: VPOC_LLM_NO_TEMPERATURE
              value: "claude-opus-5,claude-fable-5,gpt-6"
            # 출력이 max_tokens 에서 잘리면 같은 모델로 min(max_tokens × FACTOR, CAP) 예산으로 한 번 더. FACTOR=1 이면 끈다.
            - name: VPOC_LLM_TRUNC_RETRY_FACTOR
              value: "4"
            - name: VPOC_LLM_TRUNC_RETRY_CAP
              value: "4096"
            - name: VPOC_IMAGE_MODEL
              value: "stability.sd3-5-large-v1:0"
            - name: VPOC_IMAGE_REGION
              value: "us-west-2"
            - name: VPOC_VIDEO_MODEL
              value: "luma.ray-v2:0"
            - name: VPOC_VIDEO_REGION
              value: "us-west-2"
            # Luma 출력 버킷. 모델과 **같은 리전**이어야 한다(문서가 꼽는 Failed 첫 원인).
            - name: VPOC_VIDEO_BUCKET
              value: "whynot-video-089540175779-us-west-2"
            - name: VPOC_RESOLUTION
              value: "540p"
            - name: VPOC_DURATION
              value: "5s"
            - name: VPOC_ASPECT
              value: "16:9"
            # 실측 쿼터: Luma Ray V2 on-demand 동시 요청 = 1. 올리면 Throttling 이 난다.
            - name: VPOC_MAX_INFLIGHT
              value: "1"
            - name: VPOC_MAX_SHOTS
              value: "6"
            # 비용 상한은 없다(2026-09-23 사용자 결정). 원장은 기록만 하고 제출을 막지 않는다.
            # 단가는 아래 두 값으로 계산한다.
            - name: VPOC_TEXT_USD_PER_MTOK_IN
              value: "3"
            - name: VPOC_TEXT_USD_PER_MTOK_OUT
              value: "15"
            # ④단계 "이 샷만 의견 반영해 다시 만들기". false 면 새 액션 3개가 404 다.
            - name: VPOC_REGEN_ENABLED
              value: "true"
            # ② 영상 모델 고르기(dev 만). false 면 항상 Luma Ray2.
            - name: VPOC_MODEL_PICKER_ENABLED
              value: "true"
            - name: VPOC_ARK_MODEL_2_0
              value: "dreamina-seedance-2-0-260128"
            - name: VPOC_ARK_MODEL_2_5
              value: "dreamina-seedance-2-5-260628"
            - name: VPOC_ARK_USD_PER_SEC_2_0
              value: ""
            - name: VPOC_ARK_USD_PER_SEC_2_5
              value: ""
            - name: VPOC_ARK_RESOLUTION
              value: "720p"
            # 기존(BytePlus ARK 직결) Seedance 되돌리기 스위치(073). false 면 새 선택·새 생성에서 빠지고
            # 저장된 선택은 fal Seedance(등록 시) 또는 Luma 로 바뀐다. 진행 중인 ARK 회차는 값과 무관하게
            # BytePlus 로 끝낸다. 되돌릴 때만 config.<target>.env 에서 true 로 덮는다.
            - name: VPOC_ARK_SEEDANCE_ENABLED
              value: "false"
            # fal Seedance 계열(073): 얼굴(i2v)=짝(r2v). 제출 때 샷 방식으로 i2v/r2v 를 고른다. 빈 값이면 끈다.
            - name: VPOC_FAL_SEEDANCE_FAMILY
              value: "bytedance/seedance-2.5/image-to-video=bytedance/seedance-2.5/reference-to-video"
            # fal Seedance 계열 샷·영상 1개 길이 상한(초, 073). caps(4~30초) 대신 이 값까지만 고르고 검사한다.
            - name: VPOC_FAL_SEEDANCE_MAX_S
              value: "15"
            # fal 프롬프트 상한(바이트, 073 R5.1). 글롭=바이트[,…]. 빈 값이면 caps·2,500 으로 돌아간다.
            - name: VPOC_FAL_PROMPT_MAX_OVERRIDES
              value: "bytedance/seedance-2.5/*=4000"
            # fal Seedance 계열 r2v 이미지 지칭(073 R5.7). at(@Image1) | plain(Image 1). 빈 값·틀린 값은 at.
            - name: VPOC_FAL_SEEDANCE_TAG_STYLE
              value: "at"
            # 영상 결과 조회 포기 시간(초, 073 R15). 조회가 연속 5회 실패하고 제출 뒤 이 시간이 지나면 샷을 failed 로 끝낸다.
            - name: VPOC_POLL_GIVEUP_S
              value: "1800"
            # --- dual-style(실사+애니, 설계자 2026-10-20) ---
            # 화풍을 고르지 않고 실사 영상을 먼저 만든 뒤 애니(웹툰풍)로 변환해 두 결과를 함께 본다.
            # false 면 기존대로 화풍 하나로 만든다. 변환은 FAL_KEY 가 있어야 돈다(없으면 애니에 "변환 키 없음").
            - name: VPOC_DUAL_STYLE_ENABLED
              value: "true"
            - name: VPOC_ANIME_MODEL
              value: "fal-ai/kling-video/o3/standard/video-to-video/edit"
            - name: VPOC_ANIME_USD_PER_S
              value: "0.14"
            # vpoc2 (명령 → 캐릭터 확정 → 15초 영상 → 리뷰). false 면 /api/vpoc2 가 없다.
            - name: VPOC2_ENABLED
              value: "true"
            # 외부 SaaS(Seedance) 경로. real 계약이 확정되기 전에는 mock 외 값을 허용하지 않는다.
            # **이야기 분석·기준 이미지와 같은 스위치가 아니다** — 아래 STORY_MODEL_MODE 를 본다.
            - name: PROVIDER_MODE
              value: "mock"
            # 이야기 분석·기준 이미지 역할이 우리 계정 Bedrock 을 실제로 부를지.
            # 계약 경계(PROVIDER_MODE)와 비용 스위치를 한 변수에 얹지 않는다.
            - name: STORY_MODEL_MODE
              value: "real"
            # 법무 승인 전 원본·파생 웹툰 자산의 외부 provider 전송을 차단한다.
            - name: SEEDANCE_ALLOW_ORIGINAL_ASSETS
              value: "false"
            # --- Seedance 2.0 (AWS Marketplace SaaS · BytePlus ModelArk) ---
            #
            # **Bedrock 모델이 아니다.** 우리가 가진 것은 Marketplace 상품
            # `prod-vdri6kfaqizps` 의 SaaS 계약이고(License Manager 에서 AVAILABLE,
            # 2026-09-09~2026-10-09), 호출은 ModelArk 의 HTTPS API 로 나간다. 그래서
            # `bedrock list-foundation-models` 에 안 보이는 것이 정상이다.
            #
            # 실측: 이 네 값이 매니페스트에 없어서 코드 기본값(stub · test_only)이 그대로
            # 적용되고 있었다. 값을 바꿀 자리를 만들어 둔다.
            - name: SEEDANCE_MODE
              value: "stub"
            - name: ARK_BASE_URL
              value: "https://ark.ap-southeast.bytepluses.com/api/v3"
            - name: ARK_MODEL_ID
              value: "dreamina-seedance-2-0-260128"
            - name: VENDOR_INPUT_POLICY
              value: "test_only"
            # 벤더 API 키. **인증 Secret 과 섞지 않는다.** 아직 없으면 Secret 자체가 없고
            # optional 이라 파드는 그대로 뜬다 — 그때는 코드가 live 제출을 거부한다.
            - name: ARK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: seedance-api-key
                  key: ark-api-key
                  optional: true
            # fal.ai API 키(설계자 2026-10-18). ARK_API_KEY 와 같은 모양 — 아직 Secret 이 없으면
            # optional 이라 파드는 그대로 뜨고, 그때는 ② 모델 고르기에서 fal 이 "fal API 키 미설정"
            # 으로 보이고 카탈로그/등록 API 가 409 를 돌려준다.
            - name: FAL_KEY
              valueFrom:
                secretKeyRef:
                  name: fal-api-key
                  key: fal-api-key
                  optional: true
            # 요청 본문 스키마를 공식 문서로 확인했는가. 확인 전에는 live 제출을 막는다.
            - name: SEEDANCE_SCHEMA_VERIFIED
              value: "false"
            # 계약 조건. 사용자가 주기 전에는 비어 있고, 비면 금액·토큰을 계산하지 않는다.
            - name: SEEDANCE_CONTRACT_TOKEN_TOTAL
              value: ""
            - name: SEEDANCE_CONTRACT_TOKEN_RATES
              value: ""
            - name: SEEDANCE_CONTRACT_ENDS_AT
              value: "2026-10-09"
            # --- 장면 영상화 provider (spec: scene-video-aws-only) ---
            #
            # 이 네 값이 "어떤 경로로 영상이 만들어지는가" 를 정한다. 코드 기본값에
            # 의존하지 않고 매니페스트에서 명시한다 — 이전에 SEEDANCE_MODE 를 주입하지
            # 않아 코드 기본값(stub)이 운영에 그대로 적용되어, 사용자에게 파란 단색
            # 화면이 "생성 완료" 로 나가던 문제가 있었다.
            - name: SCENE_VIDEO_PROVIDER
              value: bedrock_luma
            - name: SCENE_VIDEO_ALLOWED_PROVIDERS
              value: bedrock_luma,bedrock_reel
            # 운영에서 반드시 false. true 면 자리표시자가 결과물로 나간다(D-A04).
            - name: SCENE_VIDEO_ALLOW_STUB
              value: "false"
            # 자체 GPU 경로의 서버측 스위치. UI 숨김만으로는 API 직접 호출을 막지 못한다.
            - name: SCENE_VIDEO_GPU_ENABLED
              value: "false"
            - name: SCENE_VIDEO_VERIFICATION_TTL_SECONDS
              value: "604800"
            # 계정 고정 가드. 이 값과 다른 계정에서 기동되면 기능 라우트를 모두 거부한다.
            - name: EXPECTED_ACCOUNT_ID
              value: "089540175779"
            - name: MODEL_CATALOG_PATH
              value: /etc/ai-poc/models.json
            - name: MODEL_CONFIG_KEY
              value: _config/models.json
            # vpoc1(2026-09-23): 자체 GPU 추론 서버(Wan 2.2 I2V) 주소를 지웠다. 그 경로의
            # 코드가 사라졌고 GPU 노드도 두지 않는다. 다시 들여오려면 k8s-gpu/ 와 함께 되돌린다.
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: whynot-auth
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whynot-auth
                  key: password
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: whynot-auth
                  key: token-secret
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-catalog
              mountPath: /etc/ai-poc
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: model-catalog
          configMap:
            name: whynot-models
            items:
              - key: models.json
                path: models.json
---
apiVersion: v1
kind: Service
metadata:
  name: whynot-app
  namespace: whynot
  labels:
    app.kubernetes.io/name: whynot-app
    app.kubernetes.io/part-of: whynot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: whynot-app
  ports:
    - name: http
      port: 8000
      targetPort: http
