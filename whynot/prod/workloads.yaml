              value: "true"
            # 영상만들기_신규(vnew, 설계자 2026-10-20). 기본 꺼짐, 개발계에서만 켠다.
            # 켜지면 /api/vnew 가 등록되고 video_new 트랙 생성이 허용된다. 운영은 꺼져 지금 화면 그대로.
